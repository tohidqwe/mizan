name: AI Android Factory Queue Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aifactory-queue-worker.yml'
      - '.aifactory/generate.py'

permissions:
  contents: write
  id-token: write
  copilot-requests: write

jobs:
  build-one:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Lease one queued build
        id: lease
        shell: bash
        env:
          BUILD_API: https://kcabmxrjcezvprdlvsnr.supabase.co/functions/v1/aif-build
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aifactory-worker" | jq -r .value)"
          RESP="$(curl -fsSL -X POST "$BUILD_API/lease"             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             -d "{"worker_run_id":"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"}")"
          if [ "$(jq -r '.job == null' <<<"$RESP")" = "true" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            echo "No queued build."
            exit 0
          fi
          JOB="$(jq -c '.job' <<<"$RESP")"
          PAYLOAD="$(jq -c '{
            id:.request_id,
            app_name:.app_name,
            package_name:.package_name,
            mode:.mode,
            prompt:.prompt,
            url:.target_url,
            permissions:(.permissions // {} | to_entries | map(select(.value == true) | .key))
          }' <<<"$JOB")"
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$(jq -r .build_id <<<"$JOB")" >> "$GITHUB_OUTPUT"
          echo "req_id=$(jq -r .request_id <<<"$JOB")" >> "$GITHUB_OUTPUT"
          echo "payload_b64=$(printf '%s' "$PAYLOAD" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Checkout generator
        if: steps.lease.outputs.has_job == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.lease.outputs.has_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 22
        if: steps.lease.outputs.has_job == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        if: steps.lease.outputs.has_job == 'true'
        run: npm install -g @github/copilot

      - name: Generate prompt-specific project
        if: steps.lease.outputs.has_job == 'true'
        shell: bash
        env:
          AIF_OUT: generated-app
          AIF_REQUEST_JSON_B64: ${{ steps.lease.outputs.payload_b64 }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python .aifactory/generate.py 2>&1 | tee /tmp/aif-generate.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 20 /tmp/aif-generate.log > /tmp/aif-failure.txt || true
            exit "$code"
          fi

      - name: Mark building
        if: steps.lease.outputs.has_job == 'true'
        shell: bash
        env:
          BUILD_API: https://kcabmxrjcezvprdlvsnr.supabase.co/functions/v1/aif-build
          BUILD_ID: ${{ steps.lease.outputs.build_id }}
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aifactory-worker" | jq -r .value)"
          jq -n --arg build "$BUILD_ID" \
            '{build_id:$build,status:"building",stage:"compiling",progress:55}' \
            | curl -fsSL -X POST "$BUILD_API/worker-update" \
                -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" -d @- >/dev/null

      - name: Set up JDK 17
        if: steps.lease.outputs.has_job == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        if: steps.lease.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        if: steps.lease.outputs.has_job == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create one-time signing key
        if: steps.lease.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 20)"
          KEYSTORE="$RUNNER_TEMP/aif-generated-release.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS"             -alias aif -keyalg RSA -keysize 3072 -validity 3650             -dname "CN=AI Android Factory Generated App"
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=aif" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.lease.outputs.has_job == 'true'
        run: gradle -p generated-app :app:assembleRelease --no-daemon --stacktrace --max-workers=1

      - name: Verify package and publish release
        if: steps.lease.outputs.has_job == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQ_ID: ${{ steps.lease.outputs.req_id }}
        run: |
          set -euo pipefail
          APK="generated-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > APKSIGNER-VERIFY.txt
          OUT="AI-Generated-$REQ_ID.apk"
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          printf '%s  %s\n' "$SHA" "$OUT" > "$OUT.sha256"
          TAG="aif-$REQ_ID"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AI Android Factory · $REQ_ID" --notes "AIF_STATUS=succeeded"
          else
            gh release create "$TAG" --title "AI Android Factory · $REQ_ID" --notes "AIF_STATUS=succeeded"
          fi
          FILES=("$OUT" "$OUT.sha256" "APKSIGNER-VERIFY.txt" "aif-manifest.json")
          [ -f aif-proof.json ] && FILES+=("aif-proof.json")
          [ -f aif-agents.json ] && FILES+=("aif-agents.json")
          gh release upload "$TAG" "${FILES[@]}" --clobber
          URL="https://github.com/$GH_REPO/releases/download/$TAG/$OUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mark succeeded
        if: steps.lease.outputs.has_job == 'true'
        shell: bash
        env:
          BUILD_API: https://kcabmxrjcezvprdlvsnr.supabase.co/functions/v1/aif-build
          BUILD_ID: ${{ steps.lease.outputs.build_id }}
          APK_URL: ${{ steps.publish.outputs.url }}
          SHA: ${{ steps.publish.outputs.sha }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aifactory-worker" | jq -r .value)"
          jq -n --arg build "$BUILD_ID" --arg url "$APK_URL" --arg sha "$SHA" --arg tag "$TAG"             '{build_id:$build,status:"succeeded",stage:"ready",progress:100,apk_url:$url,apk_sha256:$sha,release_tag:$tag}'             | curl -fsSL -X POST "$BUILD_API/worker-update"                 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" -d @- >/dev/null

      - name: Mark failed
        if: failure() && steps.lease.outputs.has_job == 'true'
        shell: bash
        env:
          BUILD_API: https://kcabmxrjcezvprdlvsnr.supabase.co/functions/v1/aif-build
          BUILD_ID: ${{ steps.lease.outputs.build_id }}
        run: |
          set +e
          DETAIL="$(tail -n 8 /tmp/aif-failure.txt 2>/dev/null | tr '\n' ' ' | sed 's/[[:cntrl:]]//g' | cut -c1-1400)"
          [ -n "$DETAIL" ] || DETAIL="Build worker failed. Check GitHub Actions logs."
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aifactory-worker" | jq -r .value)"
          jq -n --arg build "$BUILD_ID" --arg msg "$DETAIL"             '{build_id:$build,status:"failed",stage:"failed",progress:100,error_code:"WORKER_FAILURE",error_message:$msg}'             | curl -fsSL -X POST "$BUILD_API/worker-update"                 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" -d @- >/dev/null
# trigger queue regression after capability-fix
