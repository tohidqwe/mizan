name: Qavanin Official Civil Code Fetch

on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/qavanin-official-fetch.yml'
      - 'android-civil-leitner/tools/qavanin_fetch.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/civil-law-leitner-v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch, parse and validate official Civil Code
        run: node android-civil-leitner/tools/qavanin_fetch.mjs
      - name: Commit validated seed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-civil-leitner/app/src/main/assets/civil_seed.json \
            android-civil-leitner/app/src/main/assets/civil_supplemental.json \
            android-civil-leitner/app/src/main/assets/civil_source_manifest.json
          if git diff --cached --quiet; then
            echo 'No seed changes to commit.'
          else
            git commit -m 'Import validated official 1335-article Civil Code dataset'
            git push origin HEAD:feature/civil-law-leitner-v0.1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qavanin-official-civil-code
          path: qavanin-official/
          if-no-files-found: warn
