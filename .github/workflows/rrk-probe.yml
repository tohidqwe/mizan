name: RRK Official Source Probe

on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/rrk-probe.yml'
      - 'android-civil-leitner/tools/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe RRK and search Civil Code
        run: node android-civil-leitner/tools/rrk_probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rrk-probe
          path: rrk-probe/
          if-no-files-found: error
