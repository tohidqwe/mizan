name: RRK Official Source Probe

on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/rrk-probe.yml'
      - 'android-civil-leitner/tools/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RRK law search page
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p rrk-probe
          curl -L --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://rrk.ir/ords/r/rrs/rrs-front/ghavanin-moghararat' \
            -o rrk-probe/search.html
          wc -c rrk-probe/search.html
          grep -Eo 'P67_[A-Z_]+' rrk-probe/search.html | sort -u | head -50 || true
          grep -n -m 5 'قانون مدنی' rrk-probe/search.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: rrk-probe
          path: rrk-probe/search.html
          if-no-files-found: error
