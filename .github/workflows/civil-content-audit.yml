name: Civil Code content audit

on:
  push:
    branches:
      - feature/civil-140-day-srs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch official Civil Code sources
        id: official_sources
        continue-on-error: true
        run: node scripts/civil/fetch-official-sources.mjs

      - name: Compare qavanin and Majlis article spine
        id: official_spine
        if: steps.official_sources.outcome == 'success'
        continue-on-error: true
        run: node scripts/civil/build-verified-spine.mjs

      - name: Upload legal-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civil-official-source-audit
          path: |
            artifacts/civil-official-sources/
            artifacts/civil-verified-spine/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce official-source gate
        if: steps.official_sources.outcome != 'success'
        run: |
          echo 'Civil Code release gate remains CLOSED because at least one required official source could not be retrieved reliably.'
          exit 1

      - name: Enforce two-source text gate
        if: steps.official_sources.outcome == 'success' && steps.official_spine.outcome != 'success'
        run: |
          echo 'Civil Code release gate remains CLOSED because the qavanin/Majlis 1..1335 text spine is incomplete, duplicated, or conflicting.'
          exit 1
