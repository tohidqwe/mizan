name: RRK Official Gazette Live Probe

on:
  push:
    branches:
      - feature/civil-law-leitner-v0.1
    paths:
      - '.github/workflows/rrk-live-probe.yml'
      - 'android-civil-leitner/tools/rrk_probe.py'
  workflow_dispatch:

jobs:
  rrk-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe rrk.ir and capture public entry points
        shell: bash
        run: |
          set -euo pipefail
          python android-civil-leitner/tools/rrk_probe.py
      - name: Upload RRK probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: rrk-live-probe-evidence
          path: android-civil-leitner/rrk-probe/
          if-no-files-found: error
