name: Trade Mirror Completeness
on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/trade-mirror-probe.yml'
      - 'android-civil-leitner/tools/probe_trade_mirrors.mjs'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node android-civil-leitner/tools/probe_trade_mirrors.mjs
