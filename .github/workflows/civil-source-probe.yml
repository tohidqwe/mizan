name: Civil Code Source Probe

on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/civil-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official and fallback consolidated sources
        shell: bash
        run: |
          set -u
          mkdir -p source-probe
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          fetch() {
            name="$1"; url="$2"
            echo "=== $name ==="
            code=$(curl -L -A "$UA" --connect-timeout 15 --max-time 60 -sS -o "source-probe/$name.html" -w '%{http_code}' "$url" || true)
            echo "$code" > "source-probe/$name.status"
            wc -c "source-probe/$name.html" 2>/dev/null || true
            grep -o -m 3 'ماده ۱۳۳۵\|ماده 1335\|ماده ۱\|ماده 1' "source-probe/$name.html" 2>/dev/null || true
          }
          fetch qavanin 'https://qavanin.ir/Law/TreeText/?IDS=12021850837713548188'
          fetch qavanin_print 'https://qavanin.ir/Law/PrintText/?IDS=12021850837713548188&font='
          fetch nezamat 'https://nezamat.ir/%D9%82%D8%A7%D9%86%D9%88%D9%86-%D9%85%D8%AF%D9%86%DB%8C/'
          fetch roham 'https://rohamahmadzadeh.ir/fa/laws/ghanoon-madani'
      - uses: actions/upload-artifact@v4
        with:
          name: civil-source-probe
          path: source-probe/
          if-no-files-found: error
