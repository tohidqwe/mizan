name: Dr Tohid Course Android CI

on:
  push:
    branches:
      - product/dr-tohid-najafian-course-v0.1
    paths:
      - "android-civil-leitner/**"
      - ".github/workflows/dr-tohid-course-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-tohid-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-civil-leitner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-tohid-najafian-course-debug
          path: android-civil-leitner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
