name: Dr Tohid Course Android CI

on:
  push:
    branches:
      - product/dr-tohid-najafian-course-v0.1
    paths:
      - "android-civil-leitner/**"
      - ".github/workflows/dr-tohid-course-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-tohid-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-civil-leitner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Using Android SDK at $ANDROID_HOME"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-tohid-najafian-course-debug
          path: android-civil-leitner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
