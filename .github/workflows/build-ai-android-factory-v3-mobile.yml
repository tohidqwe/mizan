name: Build AI Android Factory v3 Mobile

on:
  push:
    branches: [main]
    paths:
      - '.aifactory/mobile-v3/**'
      - '.github/workflows/build-ai-android-factory-v3-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct mobile source
        shell: bash
        run: |
          set -euo pipefail
          cat .aifactory/mobile-v3/source.part01 .aifactory/mobile-v3/source.part02 .aifactory/mobile-v3/source.part03 .aifactory/mobile-v3/source.part04 .aifactory/mobile-v3/source.part05 | base64 -d > /tmp/aif-v3.tar.xz
          echo "63e4c3e8c64906e988a8aaccdfadbb34814043753beacfb246bc93d793bcdac5  /tmp/aif-v3.tar.xz" | sha256sum -c -
          mkdir -p mobile
          tar -xJf /tmp/aif-v3.tar.xz -C mobile --strip-components=1
          sed -i '/foundation.layout.weight/d' mobile/app/src/main/java/com/aifactory/mobile/ui/FactoryApp.kt

          # Fix FileProvider roots used by the generated APK installer.
          mkdir -p mobile/app/src/main/res/xml
          found_paths=0
          for p in mobile/app/src/main/res/xml/*.xml; do
            [ -f "$p" ] || continue
            if grep -q '<paths' "$p"; then
              cat > "$p" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <cache-path name="generated_apks" path="generated-apks/" />
    <cache-path name="cache_root" path="." />
    <external-cache-path name="external_cache_root" path="." />
    <files-path name="files_root" path="." />
</paths>
EOF
              found_paths=1
            fi
          done
          if [ "$found_paths" -eq 0 ]; then
            cat > mobile/app/src/main/res/xml/file_paths.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <cache-path name="generated_apks" path="generated-apks/" />
    <cache-path name="cache_root" path="." />
    <external-cache-path name="external_cache_root" path="." />
    <files-path name="files_root" path="." />
</paths>
EOF
          fi

          # Bump mobile patch version so the fixed build is easy to identify.
          sed -i 's/versionName = "3.1.0"/versionName = "3.1.1"/g; s/versionCode = 31/versionCode = 32/g' mobile/app/build.gradle.kts || true

          test -f mobile/app/build.gradle.kts
          test -f mobile/app/src/main/java/com/aifactory/mobile/ui/LiveVoiceDialog.kt
          test -f mobile/app/src/main/java/com/aifactory/mobile/data/AssistantRepository.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/aif-v3-mobile.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS"             -alias factory-mobile-v3 -keyalg RSA -keysize 3072 -validity 10000             -dname "CN=AI Android Factory v3, O=AI Android Factory"
          echo "FACTORY_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FACTORY_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "FACTORY_KEY_ALIAS=factory-mobile-v3" >> "$GITHUB_ENV"
          echo "FACTORY_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          APK="$(find mobile/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee artifact/APKSIGNER-VERIFY.txt
          cp "$APK" artifact/AI-Android-Factory-v3.1.1-Live-Voice.apk
          cd artifact
          sha256sum AI-Android-Factory-v3.1.1-Live-Voice.apk > AI-Android-Factory-v3.1.1-Live-Voice.apk.sha256
          unzip -t AI-Android-Factory-v3.1.1-Live-Voice.apk >/dev/null
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Android-Factory-v3.1.1-Live-Voice
          path: artifact/
          if-no-files-found: error
          retention-days: 7
