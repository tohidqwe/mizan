name: Dr Tohid PhD Android

on:
  push:
    branches:
      - product/dr-tohid-phd-course-v1
    paths:
      - 'android-civil-leitner/**'
      - '.github/workflows/android-civil-leitner.yml'
  pull_request:
    paths:
      - 'android-civil-leitner/**'
      - '.github/workflows/android-civil-leitner.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate 2000 English-Persian flashcards
        run: node android-civil-leitner/tools/generate_vocab_2000.mjs

      - name: Generate active fiqh bank
        run: node android-civil-leitner/tools/generate_fiqh_cards.mjs

      - name: Generate 1000 Arabic-Persian flashcards
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet word2word wordfreq
          python android-civil-leitner/tools/generate_arabic_vocab.py

      - name: Prepare Qavanin trade print verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          curl --fail --location --retry 3 --retry-delay 2             'https://vakilfasihi.com/wp-content/uploads/2024/01/%D9%86%D8%B3%D8%AE%D9%87-%DA%86%D8%A7%D9%BE%DB%8C-%D9%82%D8%A7%D9%86%D9%88%D9%86-%D8%AA%D8%AC%D8%A7%D8%B1%D8%AA.pdf'             -o /tmp/qavanin-trade.pdf
          pdftotext -layout /tmp/qavanin-trade.pdf trade-qavanin-print.txt
          grep -qi 'Qavanin.ir' trade-qavanin-print.txt
          grep -q '83457' trade-qavanin-print.txt

      - name: Generate verified current trade-law bank
        run: node android-civil-leitner/tools/generate_trade_cards.mjs

      - name: Remove all in-app legal explanations and analysis
        run: node android-civil-leitner/tools/strip_legal_analysis.mjs

      - name: Validate official legal text corpus
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          assets=pathlib.Path('android-civil-leitner/app/src/main/assets')
          seed_path=assets/'civil_seed.json'
          seed=json.loads(seed_path.read_text(encoding='utf-8'))
          manifest=json.loads((assets/'civil_source_manifest.json').read_text(encoding='utf-8'))
          trade=json.loads((assets/'trade_cards.json').read_text(encoding='utf-8'))
          tm=json.loads((assets/'trade_source_manifest.json').read_text(encoding='utf-8'))

          assert len(seed)==1335
          assert [x['articleNumber'] for x in seed]==list(range(1,1336))
          assert all(x.get('officialText','').strip() for x in seed)
          assert all(x.get('verificationStatus') in {'VERIFIED_OFFICIAL','VERIFIED_RRK'} for x in seed)
          assert all(not x.get('simpleExplanation') and not x.get('analyticalPoint') and not x.get('recallQuestion') for x in seed)
          assert manifest['officialConsolidatedSource'].startswith('https://qavanin.ir/')
          assert manifest['contentMode']=='OFFICIAL_TEXT_ONLY'
          assert hashlib.sha256(seed_path.read_bytes()).hexdigest()==manifest['seedSha256']

          assert len(trade)==tm['activeCardCount']
          assert len(trade)>=750
          assert all(x['answer'].strip() for x in trade)
          assert all(not x.get('explanation') for x in trade)
          assert tm['canonicalQavaninTree'].startswith('https://qavanin.ir/')

          print('LEGAL_TEXT_ONLY_GATE=PASS')
          print('CIVIL_MAIN_ARTICLES=1335')
          print('TRADE_CURRENT_RECORDS='+str(len(trade)))
          PY

      - name: Validate vocabulary and fiqh banks
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          a=pathlib.Path('android-civil-leitner/app/src/main/assets')
          en=json.loads((a/'vocab_cards.json').read_text(encoding='utf-8'))
          ar=json.loads((a/'arabic_vocab_cards.json').read_text(encoding='utf-8'))
          fiqh=json.loads((a/'fiqh_cards.json').read_text(encoding='utf-8'))

          assert len(en)==2000
          assert len({x['prompt'].lower() for x in en})==2000
          assert all(x['domain']=='ENGLISH' and x['answer'].strip() for x in en)

          assert len(ar)==1000
          assert len({x['prompt'] for x in ar})==1000
          assert all(x['domain']=='ARABIC' and x['answer'].strip() for x in ar)

          assert len(fiqh)>=120
          assert all(x['domain']=='FIQH' and x['prompt'].strip() and x['answer'].strip() for x in fiqh)

          ids=[x['id'] for x in en+ar+fiqh]
          assert len(ids)==len(set(ids))
          print('CURRICULUM_GATE=PASS')
          print('ENGLISH_WORDS=2000')
          print('ARABIC_WORDS=1000')
          print('FIQH_CARDS='+str(len(fiqh)))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p android-civil-leitner testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-civil-leitner assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          unzip -t android-civil-leitner/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum android-civil-leitner/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-tohid-phd-course-apk
          path: android-civil-leitner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
