name: Vocabulary Seed Gate
on:
  push:
    branches: [feature/civil-law-leitner-v0.1]
    paths:
      - '.github/workflows/vocab-probe.yml'
      - 'android-civil-leitner/tools/generate_vocab_cards.mjs'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save english-persian-dictionary@1.1.0
      - run: node android-civil-leitner/tools/generate_vocab_cards.mjs
      - run: |
          python - <<'PY'
          import json
          p='android-civil-leitner/app/src/main/assets/vocab_cards.json'
          a=json.load(open(p,encoding='utf-8'))
          assert len(a)==1000
          assert [x['ordinal'] for x in a]==list(range(1,1001))
          assert len({x['title'] for x in a})==1000
          print('VOCAB_1000_GATE=PASS')
          PY
