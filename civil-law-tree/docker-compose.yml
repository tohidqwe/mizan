services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civil_tree
      POSTGRES_USER: civil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-change-me}
    volumes:
      - civil_tree_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civil -d civil_tree"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://civil:${POSTGRES_PASSWORD:-dev-change-me}@db:5432/civil_tree
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  civil_tree_pg:
